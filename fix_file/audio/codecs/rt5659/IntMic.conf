SectionDevice."IntMic" {
    Comment "Microphone"

    ConflictingDevice [
        "Headphones"
        "HeadsetMic"
    ]

    EnableSequence [
        # 开启 Main Mic
        cset "name='Main Mic Switch' on"

        # 设置 IN3P/IN3N 到录音混音器
        cset "name='RECMIX1L INL' on"
        cset "name='RECMIX1R INR' on"

        # 开启 Boost（如果需要）
        # cset "name='IN3 Boost' 1"
        
        # 设置录音混音器输出到 ADC
        cset "name='Stereo1 ADC MIXL ADC1' on"
        cset "name='Stereo1 ADC MIXR ADC1' on"

        # 设置 ADC 音量
        cset "name='IN Capture Volume' 80%"
        cset "name='STO1 ADC Capture Volume' 80%"
    ]

    DisableSequence [
        cset "name='Main Mic Switch' off"
        cset "name='RECMIX1L INL' off"
        cset "name='RECMIX1R INR' off"
    ]

    Value {
        CapturePCM "hw:${CardId}"
        CaptureMixerElem "Main Mic"
        CaptureVolume "IN Capture Volume"
        CaptureSwitch "Main Mic Switch"
    }
}
